<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Radio SaaS Live</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b0b0b;
    color: white;
}

header {
    padding: 18px;
    text-align: center;
    background: #111;
    font-size: 20px;
    font-weight: bold;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.card {
    background: #161616;
    padding: 15px;
    margin: 10px 0;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.ok { color: #00ff88; }
.broken { color: #ff4d4d; }
.null { color: #999; }

.badge {
    background: #222;
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 12px;
    margin-top: 5px;
    display: inline-block;
}
</style>
</head>

<body>

<header>📡 RADIO SAAS LIVE</header>

<div class="container" id="list"></div>

<script>
const API = "/api";

async function load() {
    const res = await fetch(API);
    const data = await res.json();

    const list = document.getElementById("list");
    list.innerHTML = "";

    data.forEach(r => {

        let cls = "null";
        if (r.stream_status === "ok") cls = "ok";
        if (r.stream_status === "broken") cls = "broken";

        const div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
            <div>
                <b>${r.name}</b><br>
                <small>${r.stream_url || "-"}</small>
            </div>

            <div>
                <div class="${cls}">${r.stream_status}</div>
                <div class="badge">⏱ ${r.response_time_ms ?? "-"} ms</div>
            </div>
        `;

        list.appendChild(div);
    });
}

load();
setInterval(load, 5000);
</script>

</body>
</html>
