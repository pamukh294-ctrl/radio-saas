<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Radio SaaS Live</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b0b0b;
    color: white;
}

header {
    padding: 18px;
    text-align: center;
    background: #111;
    font-size: 20px;
    font-weight: bold;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px;
}

.card {
    background: #161616;
    padding: 15px;
    border-radius: 12px;
}

.ok { color: #00ff88; }
.bad { color: #ff4d4d; }
.null { color: #999; }

.chartBox {
    margin-top: 20px;
    background: #161616;
    padding: 20px;
    border-radius: 12px;
}
</style>
</head>

<body>

<header>📡 RADIO SAAS FULL SYSTEM</header>

<div class="container">

    <div class="cards" id="cards"></div>

    <div class="chartBox">
        <canvas id="chart"></canvas>
    </div>

</div>

<script>
const API = "/api";
const HISTORY = "/history";

let chart;

async function load() {
    const res = await fetch(API);
    const data = await res.json();

    const el = document.getElementById("cards");
    el.innerHTML = "";

    data.forEach(r => {
        let cls = "null";
        if (r.stream_status === "ok") cls = "ok";
        if (r.stream_status === "broken") cls = "bad";

        el.innerHTML += `
            <div class="card">
                <b>${r.name}</b><br>
                <span class="${cls}">${r.stream_status}</span><br>
                ⏱ ${r.response_time_ms ?? "-"} ms
            </div>
        `;
    });
}

async function loadHistory() {
    const res = await fetch(HISTORY);
    const data = await res.json();

    const labels = data.map(d => new Date(d.time).toLocaleTimeString());
    const ok = data.map(d => d.ok);
    const bad = data.map(d => d.broken);

    if (chart) chart.destroy();

    chart = new Chart(document.getElementById("chart"), {
        type: "line",
        data: {
            labels,
            datasets: [
                { label: "OK", data: ok, borderColor: "#00ff88" },
                { label: "BROKEN", data: bad, borderColor: "#ff4d4d" }
            ]
        }
    });
}

load();
loadHistory();

setInterval(() => {
    load();
    loadHistory();
}, 5000);
</script>

</body>
</html>
