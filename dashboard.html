<!DOCTYPE html>
<html>
<head>
  <title>Radio SaaS Player</title>
  <style>
    body {
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
    }

    .card {
      background: #222;
      margin: 10px auto;
      padding: 15px;
      width: 300px;
      border-radius: 10px;
      cursor: pointer;
    }

    .card:hover {
      background: #333;
    }

    button {
      padding: 10px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<h2>🎧 RADIO SAAS PLAYER</h2>

<div id="list"></div>

<audio id="player" controls style="margin-top:20px; width:300px;"></audio>

<script>
async function loadRadios() {
  const res = await fetch("/api/radio");
  const radios = await res.json();

  const list = document.getElementById("list");

  radios.forEach(r => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = r.name;

    div.onclick = () => {
      playRadio(r.url);
    };

    list.appendChild(div);
  });
}

function playRadio(url) {
  const player = document.getElementById("player");
  player.src = url;
  player.play();
}

loadRadios();
</script>

</body>
</html>
