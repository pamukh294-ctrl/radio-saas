<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Frekansım</title>

<style>
body{
  margin:0;
  background: linear-gradient(180deg,#0b0b10,#0f0f1a);
  color:white;
  font-family:Arial;
}

/* TOP BAR */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 20px;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.logo span{
  color:#a855f7;
}

/* CATEGORY */
.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:10px 15px;
}

.cat{
  background:#1c1c25;
  padding:10px 16px;
  border-radius:25px;
  white-space:nowrap;
  cursor:pointer;
  transition:0.2s;
}

.cat.active{
  background:#a855f7;
  box-shadow:0 0 10px #a855f7;
}

/* STATS */
.stats{
  padding:10px 15px;
  font-size:14px;
  opacity:0.9;
}

/* LIST */
.list{
  padding:10px 15px;
}

.card{
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(10px);
  margin:10px auto;
  width:320px;
  padding:14px;
  border-radius:16px;
  cursor:pointer;
  transition:0.2s;
}

.card:hover{
  transform:scale(1.02);
  background: rgba(255,255,255,0.07);
}

.ok{ border-left:4px solid #22c55e; }
.broken{ border-left:4px solid #ef4444; }

/* PLAYER */
.player{
  position:fixed;
  bottom:60px;
  left:10px;
  right:10px;
  background:rgba(20,20,30,0.9);
  backdrop-filter:blur(10px);
  padding:10px;
  border-radius:16px;
}

/* BOTTOM */
.bottom{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  justify-content:space-around;
  background:#0f0f15;
  padding:10px 0;
  font-size:12px;
}

button{
  background:#a855f7;
  border:none;
  color:white;
  padding:6px 10px;
  border-radius:8px;
  cursor:pointer;
}
</style>

</head>

<body>

<!-- TOP -->
<div class="topbar">
  <div class="logo">Frekans<span>ım</span></div>
  <button onclick="toggleFav()">❤️</button>
</div>

<!-- STATS -->
<div class="stats" id="stats"></div>

<!-- CATEGORIES -->
<div class="categories" id="cats"></div>

<!-- LIST -->
<div class="list" id="list"></div>

<!-- PLAYER -->
<div class="player">
  <audio id="audio" controls style="width:100%"></audio>
</div>

<!-- BOTTOM -->
<div class="bottom">
  <div>📻 Radyo</div>
  <div>❤️ Favori</div>
  <div>🕌 Namaz</div>
  <div>⚙️ Ayar</div>
</div>

<script>

let current = null;
let selectedCat = "All";
let dataStore = {};
let favorites = JSON.parse(localStorage.getItem("fav") || "[]");

// ---------------- LOAD ----------------
async function load(){

  const res = await fetch("/api/radio");
  const data = await res.json();

  dataStore = data.radios;

  document.getElementById("stats").innerHTML =
    `📊 Total: ${data.stats.total} | 🟢 ${data.stats.ok} | 🔴 ${data.stats.broken}`;

  renderCats();
  renderList();
}

// ---------------- CATEGORY ----------------
function renderCats(){
  const cats = ["All", ...Object.keys(dataStore)];

  const el = document.getElementById("cats");
  el.innerHTML = "";

  cats.forEach(c=>{
    const div = document.createElement("div");
    div.className = "cat" + (c===selectedCat?" active":"");
    div.innerText = c;

    div.onclick = ()=>{
      selectedCat = c;
      renderCats();
      renderList();
    };

    el.appendChild(div);
  });
}

// ---------------- LIST ----------------
function renderList(){
  const list = document.getElementById("list");
  list.innerHTML = "";

  let radios = [];

  if(selectedCat === "All"){
    Object.keys(dataStore).forEach(k=>{
      radios = radios.concat(dataStore[k]);
    });
  }else{
    radios = dataStore[selectedCat] || [];
  }

  radios.forEach(r=>{
    const div = document.createElement("div");
    div.className = "card " + r.status;

    div.innerHTML = `
      <b>${r.name}</b><br>
      ${r.status === "ok" ? "🟢 Live" : "🔴 Offline"}
    `;

    div.onclick = ()=>play(r);

    list.appendChild(div);
  });
}

// ---------------- PLAY ----------------
function play(r){

  if(r.status === "broken"){
    alert("⚠️ Bu radyo çalışmıyor");
    return;
  }

  current = r;

  const audio = document.getElementById("audio");
  audio.src = r.url;
  audio.play();
}

// ---------------- FAVORİ ----------------
function toggleFav(){

  if(!current) return;

  const exists = favorites.find(f=>f.name===current.name);

  if(!exists){
    favorites.push(current);
  }else{
    favorites = favorites.filter(f=>f.name!==current.name);
  }

  localStorage.setItem("fav", JSON.stringify(favorites));

  alert("❤️ Favoriler güncellendi");
}

load();

</script>

</body>
</html>
