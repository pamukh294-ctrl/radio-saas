<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>RadyoTR</title>

<style>
body{
  margin:0;
  background:#0b0b10;
  font-family:Arial;
  color:white;
  display:flex;
  justify-content:center;
}

/* PHONE FRAME */
.app{
  width:390px;
  height:100vh;
  background:#0f0f15;
  display:flex;
  flex-direction:column;
}

/* HEADER */
.header{
  padding:18px;
  font-size:20px;
  font-weight:bold;
}

/* CATEGORY SCROLL */
.categories{
  display:flex;
  overflow-x:auto;
  gap:10px;
  padding:10px 15px;
}

.cat{
  background:#1c1c25;
  padding:8px 14px;
  border-radius:20px;
  white-space:nowrap;
  cursor:pointer;
  font-size:13px;
}

.cat.active{
  background:#a855f7;
}

/* LIST */
.list{
  flex:1;
  overflow:auto;
  padding:10px 15px;
}

.card{
  background:#1a1a22;
  padding:14px;
  border-radius:14px;
  margin-bottom:10px;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.card:hover{
  background:#222230;
}

.title{
  font-weight:bold;
  font-size:14px;
}

.sub{
  font-size:12px;
  color:#aaa;
}

/* HEART */
.heart{
  font-size:18px;
  cursor:pointer;
}

/* PLAYER */
.player{
  position:sticky;
  bottom:0;
  background:#111;
  padding:10px;
  border-top:1px solid #222;
}

/* AUDIO */
audio{
  width:100%;
}

/* BOTTOM NAV */
.bottom{
  display:flex;
  justify-content:space-around;
  padding:10px;
  background:#0d0d12;
  font-size:12px;
}
.bottom div{
  cursor:pointer;
}
</style>

</head>

<body>

<div class="app">

  <!-- HEADER -->
  <div class="header">📻 RadyoTR</div>

  <!-- CATEGORIES -->
  <div class="categories" id="cats"></div>

  <!-- LIST -->
  <div class="list" id="list"></div>

  <!-- PLAYER -->
  <div class="player">
    <audio id="audio" controls></audio>
  </div>

  <!-- BOTTOM -->
  <div class="bottom">
    <div>🏠 Tümü</div>
    <div>❤️ Favori</div>
    <div>⚙️ Ayar</div>
  </div>

</div>

<script>

let data = {};
let currentCat = "All";

/* LOAD */
async function load(){
  const res = await fetch("/api/radio");
  const json = await res.json();
  data = json.radios;

  renderCats();
  renderList();
}

/* CATS */
function renderCats(){
  const cats = ["All", ...Object.keys(data)];
  const el = document.getElementById("cats");

  el.innerHTML = "";

  cats.forEach(c=>{
    const d = document.createElement("div");
    d.className = "cat";
    d.innerText = c;

    d.onclick = ()=>{
      currentCat = c;
      renderList();
    };

    el.appendChild(d);
  });
}

/* LIST */
function renderList(){

  const list = document.getElementById("list");
  list.innerHTML = "";

  let radios = [];

  if(currentCat === "All"){
    Object.keys(data).forEach(k=>{
      radios = radios.concat(data[k]);
    });
  } else {
    radios = data[currentCat] || [];
  }

  radios.forEach(r=>{

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div>
        <div class="title">${r.name}</div>
        <div class="sub">${r.cat}</div>
      </div>
      <div class="heart">❤️</div>
    `;

    div.onclick = ()=>play(r);

    list.appendChild(div);
  });
}

/* PLAY */
function play(r){
  const audio = document.getElementById("audio");
  audio.src = r.url;
  audio.play();
}

load();

</script>

</body>
</html>
