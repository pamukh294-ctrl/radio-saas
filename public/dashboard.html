<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Frekansım</title>

<style>
body{
  margin:0;
  background: linear-gradient(180deg,#0b0b10,#0f0f1a);
  color:white;
  font-family:Arial;
}

.topbar{
  display:flex;
  justify-content:space-between;
  padding:16px 20px;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.logo span{ color:#a855f7; }

.tabs{
  display:flex;
  justify-content:space-around;
  background:#0f0f15;
  padding:10px;
}

.tab{
  cursor:pointer;
  padding:8px 12px;
}

.tab.active{
  color:#a855f7;
  font-weight:bold;
}

.categories{
  display:flex;
  overflow-x:auto;
  gap:10px;
  padding:10px 15px;
}

.cat{
  background:#1c1c25;
  padding:10px 16px;
  border-radius:20px;
  cursor:pointer;
}

.cat.active{
  background:#a855f7;
}

.list{
  padding:10px 15px;
}

.card{
  background: rgba(255,255,255,0.04);
  margin:10px auto;
  width:320px;
  padding:14px;
  border-radius:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
}

.card:hover{
  background: rgba(255,255,255,0.07);
}

.name{
  font-weight:bold;
}

.status{
  font-size:12px;
  color:#aaa;
}

.heart{
  cursor:pointer;
  font-size:18px;
}

.player{
  position:fixed;
  bottom:60px;
  left:10px;
  right:10px;
  background:rgba(20,20,30,0.9);
  padding:10px;
  border-radius:16px;
}
</style>

</head>

<body>

<!-- TOP -->
<div class="topbar">
  <div class="logo">Frekans<span>ım</span></div>
</div>

<!-- TABS -->
<div class="tabs">
  <div class="tab active" id="tab_radio" onclick="setView('radio')">📻 Radyo</div>
  <div class="tab" id="tab_fav" onclick="setView('fav')">❤️ Favori</div>
</div>

<!-- CATEGORY -->
<div class="categories" id="cats"></div>

<!-- LIST -->
<div class="list" id="list"></div>

<!-- PLAYER -->
<div class="player">
  <audio id="audio" controls style="width:100%"></audio>
</div>

<script>

let dataStore = {};
let view = "radio";
let selectedCat = "All";
let favorites = JSON.parse(localStorage.getItem("fav") || "[]");

/* ================= NORMALIZE (EN ÖNEMLİ FIX) ================= */
function normalize(r){
  return {
    name: r.name,
    url: r.url,
    status: r.status || "fav"
  };
}

/* ================= LOAD ================= */
async function load(){
  const res = await fetch("/api/radio");
  const data = await res.json();

  dataStore = data.radios;

  renderCats();
  renderList();
}

/* ================= VIEW ================= */
function setView(v){
  view = v;

  document.getElementById("tab_radio").classList.remove("active");
  document.getElementById("tab_fav").classList.remove("active");

  if(v === "radio"){
    document.getElementById("tab_radio").classList.add("active");
  } else {
    document.getElementById("tab_fav").classList.add("active");
  }

  renderList();
}

/* ================= CATEGORY ================= */
function renderCats(){
  const cats = ["All", ...Object.keys(dataStore)];

  const el = document.getElementById("cats");
  el.innerHTML = "";

  cats.forEach(c=>{
    const div = document.createElement("div");
    div.className = "cat" + (c===selectedCat?" active":"");
    div.innerText = c;

    div.onclick = ()=>{
      selectedCat = c;
      renderCats();
      renderList();
    };

    el.appendChild(div);
  });
}

/* ================= PLAY (FIXED) ================= */
function play(r){

  if(!r || !r.url){
    alert("⚠️ Radyo verisi hatalı");
    return;
  }

  if(r.status === "broken"){
    alert("⚠️ Bu radyo çalışmıyor");
    return;
  }

  const audio = document.getElementById("audio");

  audio.pause();
  audio.src = r.url;
  audio.load();

  audio.play().catch(()=>{
    alert("▶️ Tekrar tıkla");
  });
}

/* ================= FAVORİ ================= */
function toggleFav(e, r){
  e.stopPropagation();

  const clean = normalize(r);

  const exists = favorites.find(f => f.name === clean.name);

  if(!exists){
    favorites.push(clean);
  } else {
    favorites = favorites.filter(f => f.name !== clean.name);
  }

  localStorage.setItem("fav", JSON.stringify(favorites));

  renderList();
}

/* ================= LIST ================= */
function renderList(){

  const list = document.getElementById("list");
  list.innerHTML = "";

  let radios = [];

  if(view === "fav"){
    radios = favorites.map(normalize);
  } else {

    if(selectedCat === "All"){
      Object.keys(dataStore).forEach(k=>{
        radios = radios.concat(dataStore[k]);
      });
    } else {
      radios = dataStore[selectedCat] || [];
    }

  }

  radios.forEach(r=>{

    const clean = normalize(r);

    const isFav = favorites.find(f => f.name === clean.name);

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div>
        <div class="name">${clean.name}</div>
        <div class="status">${clean.status}</div>
      </div>

      <div class="heart">
        ${isFav ? "💜" : "🤍"}
      </div>
    `;

    div.onclick = ()=>play(clean);

    div.querySelector(".heart").onclick = (e)=>{
      toggleFav(e, clean);
    };

    list.appendChild(div);
  });
}

load();

</script>

</body>
</html>
