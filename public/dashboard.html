<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Radio SaaS</title>

  <style>
    body {
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
    }

    .card {
      background: #222;
      padding: 10px;
      margin: 8px auto;
      width: 300px;
      border-radius: 8px;
      cursor: pointer;
    }

    .card:hover { background: #333; }

    button {
      margin: 10px;
      padding: 8px;
    }

    audio {
      width: 300px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<h2>🎧 RADIO SAAS</h2>

<div id="list"></div>

<audio id="player" controls></audio>

<br>

<button onclick="toggleFavorite()">❤️ Favori</button>

<script>

let currentRadio = null;
let favorites = JSON.parse(localStorage.getItem("favorites") || "[]");

// -------------------- RADYOLARI YÜKLE --------------------
async function loadRadios() {
  const res = await fetch("/api/radio");
  const data = await res.json();

  const list = document.getElementById("list");

  Object.keys(data).forEach(cat => {

    const title = document.createElement("h3");
    title.innerText = "📁 " + cat;
    list.appendChild(title);

    data[cat].forEach(r => {
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = r.name;

      div.onclick = () => playRadio(r);

      list.appendChild(div);
    });

  });
}

// -------------------- PLAY --------------------
function playRadio(r) {
  currentRadio = r;

  const player = document.getElementById("player");

  player.pause();
  player.src = r.url;
  player.load();

  player.play().catch(() => {
    alert("⚠️ Çalma engellendi, tekrar tıkla");
  });
}

// -------------------- FAVORİ --------------------
function toggleFavorite() {
  if (!currentRadio) return;

  const exists = favorites.find(f => f.name === currentRadio.name);

  if (!exists) {
    favorites.push(currentRadio);
  } else {
    favorites = favorites.filter(f => f.name !== currentRadio.name);
  }

  localStorage.setItem("favorites", JSON.stringify(favorites));

  alert("❤️ Favoriler güncellendi");
}

loadRadios();

</script>

</body>
</html>
