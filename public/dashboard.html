<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Radio SaaS</title>

  <style>
    body {
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
    }

    .card {
      background: #222;
      padding: 10px;
      margin: 10px auto;
      width: 300px;
      border-radius: 8px;
      cursor: pointer;
    }

    .ok { border-left: 5px solid green; }
    .broken { border-left: 5px solid red; }

    audio {
      width: 300px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<h2>🎧 RADIO SAAS LIVE</h2>

<div id="list"></div>

<audio id="player" controls></audio>

<script>

async function loadRadios() {
  const res = await fetch("/api/radio");
  const radios = await res.json();

  const list = document.getElementById("list");

  radios.forEach(r => {
    const div = document.createElement("div");

    div.className = "card " + r.status;

    div.innerHTML = `
      <b>${r.name}</b><br>
      Status: ${r.status}
    `;

    div.onclick = () => playRadio(r);

    list.appendChild(div);
  });
}

function playRadio(r) {
  const player = document.getElementById("player");

  // 🚨 UYARI SİSTEMİ
  if (r.status === "broken") {
    alert("⚠️ Bu radyo şu an çalışmıyor!");
    return;
  }

  player.src = r.url;
  player.load();

  player.play().catch(() => {
    alert("⚠️ Tarayıcı engelledi, tekrar tıkla");
  });
}

loadRadios();

</script>

</body>
</html>
