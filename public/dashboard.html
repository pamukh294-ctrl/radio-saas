<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Radio SaaS</title>

<style>
body { background:#111; color:white; font-family:Arial; text-align:center; }
.card { background:#222; margin:10px auto; width:300px; padding:10px; border-radius:10px; cursor:pointer; }
.ok { border-left:5px solid green; }
.broken { border-left:5px solid red; }
audio { width:300px; margin-top:15px; }
</style>

</head>
<body>

<h2>🎧 RADIO SAAS</h2>

<div id="stats"></div>
<div id="list"></div>

<audio id="player" controls></audio>

<button onclick="toggleFav()">❤️ Favori</button>

<script>

let current = null;
let favorites = JSON.parse(localStorage.getItem("fav") || "[]");

// ---------------- LOAD ----------------
async function load() {

  const res = await fetch("/api/radio");
  const data = await res.json();

  // STATS FIX
  document.getElementById("stats").innerHTML = `
    <h3>📊 Stats</h3>
    <p>Toplam: ${data.stats.total}</p>
    <p>🟢 Çalışan: ${data.stats.ok}</p>
    <p>🔴 Bozuk: ${data.stats.broken}</p>
  `;

  const list = document.getElementById("list");

  data.radios.forEach(r => {

    const div = document.createElement("div");
    div.className = "card " + r.status;

    div.innerHTML = `
      <b>${r.name}</b><br>
      ${r.status === "ok" ? "🟢 OK" : "🔴 BROKEN"}
    `;

    div.onclick = () => play(r);

    list.appendChild(div);
  });
}

// ---------------- PLAY ----------------
function play(r) {

  if (r.status === "broken") {
    alert("⚠️ Bu radyo çalışmıyor");
    return;
  }

  current = r;

  const player = document.getElementById("player");
  player.src = r.url;
  player.load();
  player.play().catch(()=>alert("Play engellendi, tekrar tıkla"));
}

// ---------------- FAVORİ ----------------
function toggleFav() {
  if (!current) return;

  const exists = favorites.find(f => f.name === current.name);

  if (!exists) favorites.push(current);
  else favorites = favorites.filter(f => f.name !== current.name);

  localStorage.setItem("fav", JSON.stringify(favorites));

  alert("❤️ Favoriler güncellendi");
}

load();

</script>

</body>
</html>
