<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Frekansım</title>

<style>
body{
  margin:0;
  background:#0b0b10;
  color:white;
  font-family:Arial;
}

.top{
  padding:15px;
  font-size:20px;
  font-weight:bold;
}

.cat{
  display:inline-block;
  padding:8px 14px;
  background:#1c1c25;
  margin:5px;
  border-radius:20px;
  cursor:pointer;
}

.card{
  background:#1a1a22;
  margin:10px;
  padding:12px;
  border-radius:12px;
  cursor:pointer;
}

.player{
  position:fixed;
  bottom:0;
  width:100%;
  background:#111;
  padding:10px;
}
</style>

</head>

<body>

<div class="top">🎧 Frekansım</div>

<div id="cats"></div>
<div id="list"></div>

<div class="player">
  <audio id="audio" controls style="width:100%"></audio>
</div>

<script>

let data = {};
let currentCat = "All";

/* ================= LOAD ================= */
async function load(){

  const res = await fetch("/api/radio");
  const json = await res.json();

  data = json.radios;

  renderCats();
  renderList();
}

/* ================= CATEGORIES ================= */
function renderCats(){

  const cats = ["All", ...Object.keys(data)];

  const el = document.getElementById("cats");
  el.innerHTML = "";

  cats.forEach(c=>{
    const d = document.createElement("div");
    d.className = "cat";
    d.innerText = c;

    d.onclick = ()=>{
      currentCat = c;
      renderList();
    };

    el.appendChild(d);
  });
}

/* ================= LIST ================= */
function renderList(){

  const list = document.getElementById("list");
  list.innerHTML = "";

  let radios = [];

  if(currentCat === "All"){
    Object.keys(data).forEach(k=>{
      radios = radios.concat(data[k]);
    });
  } else {
    radios = data[currentCat] || [];
  }

  radios.forEach(r=>{

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <b>${r.name}</b><br>
      ${r.cat}
    `;

    div.onclick = ()=>play(r);

    list.appendChild(div);
  });
}

/* ================= PLAY ================= */
function play(r){
  const audio = document.getElementById("audio");
  audio.src = r.url;
  audio.play();
}

load();

</script>

</body>
</html>
