<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Radio SaaS</title>

<style>
body { background:#111; color:white; font-family:Arial; text-align:center; }

.card {
  background:#222;
  margin:10px auto;
  width:300px;
  padding:10px;
  border-radius:10px;
  cursor:pointer;
}

.ok { border-left:5px solid green; }
.broken { border-left:5px solid red; }

audio { width:300px; margin-top:15px; }

h3 { margin-top:20px; }
</style>

</head>
<body>

<h2>🎧 RADIO SAAS</h2>

<div id="stats"></div>
<div id="list"></div>

<audio id="player" controls></audio>

<script>

let current = null;

// ---------------- LOAD ----------------
async function load() {

  const res = await fetch("/api/radio");
  const data = await res.json();

  document.getElementById("stats").innerHTML = `
    📊 Total: ${data.stats.total} |
    🟢 OK: ${data.stats.ok} |
    🔴 Broken: ${data.stats.broken}
  `;

  const list = document.getElementById("list");

  Object.keys(data.radios).forEach(cat => {

    const title = document.createElement("h3");
    title.innerText = "📁 " + cat;
    list.appendChild(title);

    data.radios[cat].forEach(r => {

      const div = document.createElement("div");
      div.className = "card " + r.status;

      div.innerHTML = `
        <b>${r.name}</b><br>
        ${r.status === "ok" ? "🟢 Live" : "🔴 Offline"}
      `;

      div.onclick = () => play(r);

      list.appendChild(div);
    });
  });
}

// ---------------- PLAY ----------------
function play(r) {

  if (r.status === "broken") {
    alert("⚠️ Bu radyo çalışmıyor");
    return;
  }

  current = r;

  const player = document.getElementById("player");
  player.src = r.url;
  player.load();
  player.play().catch(()=>alert("Play engellendi"));
}

load();

</script>

</body>
</html>
