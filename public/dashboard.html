<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Radio SaaS Player</title>
  <style>
    body {
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .card {
      background: #222;
      padding: 15px;
      margin: 10px auto;
      width: 300px;
      border-radius: 10px;
      cursor: pointer;
    }

    .card:hover {
      background: #333;
    }

    audio {
      width: 300px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<h2>🎧 RADIO PLAYER TEST</h2>

<div id="list"></div>

<audio id="player" controls></audio>

<script>
async function loadRadios() {
  const res = await fetch("/api/radio");
  const radios = await res.json();

  const list = document.getElementById("list");

  radios.forEach(r => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerText = r.name;

    div.onclick = () => play(r.url);

    list.appendChild(div);
  });
}

function play(url) {
  const player = document.getElementById("player");

  player.pause();
  player.src = url;
  player.load();

  const p = player.play();

  if (p !== undefined) {
    p.catch(err => {
      alert("Play engellendi: tekrar tıkla");
      console.log(err);
    });
  }
}

loadRadios();
</script>

</body>
</html>
